[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codeweights-ids"
version = "0.1.0"
description = "Adversarially auditable cyber-physical intrusion detection via interpretable weight-space programming (iWSP) for V2X / SAE J2735 BSMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "faysalchowdhoury" }]
keywords = ["intrusion detection", "V2X", "SAE J2735", "weight-space programming",
            "interpretability", "adversarial robustness", "backdoor", "shortcut learning"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.optional-dependencies]
# The iWSP loop runs fully offline by default; the API driver is optional.
llm = ["anthropic>=0.40"]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["data", "src", "src.synthesized_models", "experiments"]
